version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agelens
      POSTGRES_PASSWORD: agelens
      POSTGRES_DB: agelens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agelens"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-prod_jwt_secret_change_me_32chars_min}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-$2a$12$HqZkoXJbSOXT4mkvVDiaiOSV5Rx9576mUDyxsmNLDIx9lyILjDe6a}
      DATABASE_URL: postgres://agelens:agelens@postgres:5432/agelens
      FRONTEND_URL: http://localhost:5173
    ports:
      - "4000:4000"
    volumes:
      - storage:/app/storage
      - dbdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  storage:
  dbdata:
